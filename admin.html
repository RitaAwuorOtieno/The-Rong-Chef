<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - The Rong Cheff</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .admin-header {
            background: #1a1a1a;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .remarks-list {
            margin-top: 2rem;
        }
        .remark-card {
            background: white;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        .remark-content {
            flex: 1;
        }
        .remark-author {
            font-weight: bold;
            color: #e67e22;
        }
        .remark-date {
            color: #999;
            font-size: 0.8rem;
        }
        .remark-text {
            margin: 0.5rem 0;
        }
        .remark-rating {
            color: #ffd700;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #c82333;
        }
        .edit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
        }
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .bookings-list {
            margin-top: 2rem;
        }
        .booking-card {
            background: #f9f9f9;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
            border-left: 4px solid #e67e22;
        }
        .tab-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .tab-btn {
            padding: 0.5rem 1rem;
            background: #e67e22;
            color: white;
            border: none;
            cursor: pointer;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h2><i class="fas fa-utensils"></i> The Rong Cheff - Admin Dashboard</h2>
        <button onclick="logout()" class="btn" style="background: #dc3545;">Logout</button>
    </div>

    <div class="admin-container">
        <div class="tab-buttons">
            <button class="tab-btn" onclick="showTab('remarks')">Manage Remarks</button>
            <button class="tab-btn" onclick="showTab('bookings')">View Bookings</button>
            <button class="tab-btn" onclick="showTab('add-remark')">Add New Remark</button>
        </div>

        <!-- Remarks Tab -->
        <div id="remarks-tab" class="tab-content active">
            <h3>Customer Remarks & Reviews</h3>
            <div id="remarks-list" class="remarks-list">
                Loading...
            </div>
        </div>

        <!-- Bookings Tab -->
        <div id="bookings-tab" class="tab-content">
            <h3>Booking Requests</h3>
            <div id="bookings-list" class="bookings-list">
                Loading...
            </div>
        </div>

        <!-- Add Remark Tab -->
        <div id="add-remark-tab" class="tab-content">
            <h3>Add New Remark/Testimonial</h3>
            <form id="add-remark-form">
                <input type="text" id="author" placeholder="Customer Name" required>
                <select id="rating" required>
                    <option value="">Select Rating</option>
                    <option value="5">★★★★★ (5)</option>
                    <option value="4">★★★★☆ (4)</option>
                    <option value="3">★★★☆☆ (3)</option>
                    <option value="2">★★☆☆☆ (2)</option>
                    <option value="1">★☆☆☆☆ (1)</option>
                </select>
                <textarea id="remark-text" rows="4" placeholder="Customer remark..." required></textarea>
                <button type="submit" class="btn btn-primary">Add Remark</button>
            </form>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>Edit Remark</h3>
            <input type="text" id="edit-author" placeholder="Customer Name">
            <select id="edit-rating">
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
            </select>
            <textarea id="edit-text" rows="4" placeholder="Remark text"></textarea>
            <button onclick="saveEdit()" class="btn btn-primary">Save Changes</button>
            <button onclick="closeModal()" class="btn">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        
        const auth = getAuth();
        const db = getFirestore();
        let currentEditId = null;
        
        // Check if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                loadRemarks();
                loadBookings();
            }
        });
        
        window.logout = async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        };
        
        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tab}-tab`).classList.add('active');
        };
        
        // Load remarks
        async function loadRemarks() {
            const remarksDiv = document.getElementById('remarks-list');
            remarksDiv.innerHTML = 'Loading...';
            
            try {
                const querySnapshot = await getDocs(collection(db, 'remarks'));
                if (querySnapshot.empty) {
                    remarksDiv.innerHTML = '<p>No remarks yet. Add your first remark!</p>';
                    return;
                }
                
                remarksDiv.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const remark = doc.data();
                    remarksDiv.innerHTML += `
                        <div class="remark-card">
                            <div class="remark-content">
                                <div class="remark-author">${remark.author}</div>
                                <div class="remark-rating">${'★'.repeat(remark.rating)}${'☆'.repeat(5-remark.rating)}</div>
                                <div class="remark-text">${remark.text}</div>
                                <div class="remark-date">${new Date(remark.date).toLocaleDateString()}</div>
                            </div>
                            <div>
                                <button class="edit-btn" onclick="editRemark('${doc.id}', '${remark.author}', ${remark.rating}, '${remark.text.replace(/'/g, "\\'")}')">Edit</button>
                                <button class="delete-btn" onclick="deleteRemark('${doc.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                remarksDiv.innerHTML = `<p>Error loading remarks: ${error.message}</p>`;
            }
        }
        
        // Load bookings (from Netlify or create bookings collection)
        async function loadBookings() {
            const bookingsDiv = document.getElementById('bookings-list');
            bookingsDiv.innerHTML = 'Loading...';
            
            try {
                const querySnapshot = await getDocs(collection(db, 'bookings'));
                if (querySnapshot.empty) {
                    bookingsDiv.innerHTML = '<p>No bookings yet.</p>';
                    return;
                }
                
                bookingsDiv.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const booking = doc.data();
                    bookingsDiv.innerHTML += `
                        <div class="booking-card">
                            <strong>${booking.name}</strong> - ${booking.email}<br>
                            Date: ${booking.date} at ${booking.time}<br>
                            Guests: ${booking.guests}<br>
                            Message: ${booking.message || 'None'}<br>
                            <small>Submitted: ${new Date(booking.submitted).toLocaleString()}</small>
                        </div>
                    `;
                });
            } catch (error) {
                bookingsDiv.innerHTML = `<p>Error loading bookings: ${error.message}</p>`;
            }
        }
        
        // Add new remark
        document.getElementById('add-remark-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const author = document.getElementById('author').value;
            const rating = parseInt(document.getElementById('rating').value);
            const text = document.getElementById('remark-text').value;
            
            try {
                await addDoc(collection(db, 'remarks'), {
                    author: author,
                    rating: rating,
                    text: text,
                    date: new Date().toISOString()
                });
                
                alert('Remark added successfully!');
                document.getElementById('add-remark-form').reset();
                loadRemarks();
            } catch (error) {
                alert(`Error adding remark: ${error.message}`);
            }
        });
        
        window.deleteRemark = async (id) => {
            if (confirm('Are you sure you want to delete this remark?')) {
                try {
                    await deleteDoc(doc(db, 'remarks', id));
                    loadRemarks();
                } catch (error) {
                    alert(`Error deleting remark: ${error.message}`);
                }
            }
        };
        
        window.editRemark = (id, author, rating, text) => {
            currentEditId = id;
            document.getElementById('edit-author').value = author;
            document.getElementById('edit-rating').value = rating;
            document.getElementById('edit-text').value = text;
            document.getElementById('edit-modal').style.display = 'flex';
        };
        
        window.saveEdit = async () => {
            const author = document.getElementById('edit-author').value;
            const rating = parseInt(document.getElementById('edit-rating').value);
            const text = document.getElementById('edit-text').value;
            
            try {
                await updateDoc(doc(db, 'remarks', currentEditId), {
                    author: author,
                    rating: rating,
                    text: text
                });
                
                closeModal();
                loadRemarks();
                alert('Remark updated successfully!');
            } catch (error) {
                alert(`Error updating remark: ${error.message}`);
            }
        };
        
        window.closeModal = () => {
            document.getElementById('edit-modal').style.display = 'none';
            currentEditId = null;
        };
        
        // Save form submissions to Firebase
        window.saveBookingToFirebase = async (bookingData) => {
            try {
                await addDoc(collection(db, 'bookings'), {
                    ...bookingData,
                    submitted: new Date().toISOString()
                });
            } catch (error) {
                console.error('Error saving booking:', error);
            }
        };
    </script>
</body>
</html>
