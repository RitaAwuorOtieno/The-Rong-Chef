<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - The Rong Chef</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #1a1a1a;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-container button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 1rem;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
        }
        .success-message {
            color: #28a745;
            text-align: center;
            margin-top: 1rem;
            padding: 10px;
            background: #d4edda;
            border-radius: 5px;
        }
        .back-link {
            text-align: center;
            margin-top: 1rem;
        }
        .back-link a {
            color: #e67e22;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2><i class="fas fa-utensils"></i> The Rong Chef</h2>
        <h3 style="text-align: center; margin-bottom: 1rem;">Admin Login</h3>
        
        <form id="login-form">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        
        <div id="message"></div>
        
        <div class="back-link">
            <a href="index.html">← Back to Website</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        
        // REPLACE WITH YOUR ACTUAL FIREBASE CONFIG
         const firebaseConfig = {
  apiKey: "AIzaSyC2671-k8-pU8gb5QmJWmMEWAIciAJsEeA",
  authDomain: "the-rong-chef.firebaseapp.com",
  projectId: "the-rong-chef",
  storageBucket: "the-rong-chef.firebasestorage.app",
  messagingSenderId: "9185728688",
  appId: "1:9185728688:web:5aeeaca66312de1051c375"
};
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerHTML = '<div class="success-message">Logging in...</div>';
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                messageDiv.innerHTML = '<div class="success-message">Login successful! Redirecting to dashboard...</div>';
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);
            } catch (error) {
                let errorMessage = 'Login failed. ';
                if (error.code === 'auth/invalid-credential') {
                    errorMessage += 'Invalid email or password.';
                } else if (error.code === 'auth/user-not-found') {
                    errorMessage += 'User not found.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage += 'Wrong password.';
                } else {
                    errorMessage += error.message;
                }
                messageDiv.innerHTML = `<div class="error-message">${errorMessage}</div>`;
            }
        });
    </script>
</body>
</html>
